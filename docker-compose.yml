services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: automark-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  server:
    build:
      context: ./server
    container_name: automark-server
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      - KAFKA_BROKER=kafka:29092

    ports:
      - "5000:5000"

    depends_on:
      - kafka

  analytics-consumer:
    build:
      context: ./server
    container_name: automark-analytics-consumer
    restart: unless-stopped

    command: npm run consumer

    env_file:
      - ./server/.env

    environment:
      - KAFKA_BROKER=kafka:29092

    depends_on:
      - kafka

  user-consumer:
    build:
      context: ./server
    container_name: automark-user-consumer
    restart: unless-stopped

    command: npm run user-consumer

    env_file:
      - ./server/.env

    environment:
      - KAFKA_BROKER=kafka:29092

    depends_on:
      - kafka

  client:
    build:
      context: ./client

    container_name: automark-client
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - server
